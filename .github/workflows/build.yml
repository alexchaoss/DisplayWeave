name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: a cancelled release job could leave a half-made draft behind.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides before the builds whether this push makes a release, because only that build is signed.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Draft releases are listed only to tokens that can write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find whether this version already has a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          version="$(tr -d '[:space:]' < src/DisplayWeave/version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ "$MAIN_PUSH" = "true" ] || exit 0
          # The list includes drafts, so a draft waiting for its signature is not made twice.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "v$version"; then
            echo "v$version already has a release or draft; bump src/DisplayWeave/version.txt to make another."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The release build signs through the release environment, which admits only main; its
    # federated credential is the only way into the Azure signing account.
    environment: ${{ matrix.os == 'windows-2022' && needs.version.outputs.release == 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # Azure sign-in for code signing
    env:
      SIGN: ${{ matrix.os == 'windows-2022' && needs.version.outputs.release == 'true' }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the verified Zig toolchain
        run: ./scripts/fetch-tools.ps1

      - name: Build x64 and x86 native components
        run: ./scripts/build-native.ps1 -Architecture all

      - name: Sign in to Azure for code signing
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Before build.ps1, which hashes the helpers into the app: signing changes their bytes.
      - name: Sign the native components
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: displayweave
          certificate-profile-name: displayweave-public
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,dll
          files-folder-recurse: true

      # After the native components: the app embeds their hashes for administrator mode.
      - name: Build the Windows application
        run: ./scripts/build.ps1

      - name: Sign the Windows application
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: displayweave
          certificate-profile-name: displayweave-public
          files: |
            ${{ github.workspace }}\dist\DisplayWeave.exe
            ${{ github.workspace }}\dist\DisplayWeave.Core.dll
            ${{ github.workspace }}\dist\DisplayWeave.Launcher.exe

      # Before packaging: the ZIP ships install.ps1 and the setup embeds it. A signed script can run
      # with -ExecutionPolicy RemoteSigned and under App Control policies such as Smart App Control.
      - name: Sign the installer script
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: displayweave
          certificate-profile-name: displayweave-public
          files: |
            ${{ github.workspace }}\installer\install.ps1

      # These test modes do not open application windows, inject hooks, or change
      # the desktop. Monitor/window rendering tests require an interactive desktop.
      - name: Run managed and native policy tests
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE 'test-results\ci'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $problems = [System.Collections.Generic.List[string]]::new()

          $report = Join-Path $reportDirectory 'managed.txt'
          $application = Join-Path $env:GITHUB_WORKSPACE 'dist\DisplayWeave.exe'
          $testProcess = Start-Process -FilePath $application -ArgumentList @('--self-test', ('"{0}"' -f $report)) -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -Wait -PassThru
          if ($testProcess.ExitCode -ne 0) {
            $problems.Add("Managed tests exited with code $($testProcess.ExitCode).")
          }

          $passed = 0
          foreach ($file in @('managed.txt', 'managed.rules.txt', 'managed.automatic.txt', 'managed.lifecycle.txt')) {
            $reportPath = Join-Path $reportDirectory $file
            if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) {
              $problems.Add("Missing managed test report: $file")
              continue
            }
            $result = Get-Content -LiteralPath $reportPath -Raw
            Write-Output $result
            $summary = [regex]::Match($result, '(?m)^(\d+) passed; 0 failed\.\s*$')
            if ($summary.Success -and $result -notmatch '(?m)^FAIL ') {
              $passed += [int]$summary.Groups[1].Value
            } else {
              $problems.Add("Managed test report has failures or no passing summary: $file")
            }
          }
          if ($passed -lt 108) {
            $problems.Add("Expected at least 108 passing managed tests; found $passed.")
          }

          foreach ($architecture in @('x64', 'x86')) {
            $helper = Join-Path $env:GITHUB_WORKSPACE "dist\native-v2-$architecture\RegionHookHost.exe"
            $policyReport = Join-Path $reportDirectory "$architecture-policy.txt"
            & $helper --self-test-policy 2>&1 | Tee-Object -FilePath $policyReport
            if ($LASTEXITCODE -ne 0) {
              $problems.Add("$architecture shell policy tests exited with code $LASTEXITCODE.")
            }
            $policySummary = [regex]::Match((Get-Content -LiteralPath $policyReport -Raw), '^PASS shell and resident-hook policy: (\d+) deterministic cases;')
            if (!$policySummary.Success -or [int]$policySummary.Groups[1].Value -lt 223) {
              $problems.Add("$architecture shell policy tests did not report success.")
            }
            & $helper --self-test-ipc 2>&1 | Tee-Object -FilePath (Join-Path $reportDirectory "$architecture-ipc.txt")
            if ($LASTEXITCODE -ne 0) { $problems.Add("$architecture IPC security tests failed.") }
          }
          if ($problems.Count -gt 0) { throw ($problems -join [Environment]::NewLine) }

      - name: Package the portable application
        run: ./scripts/package.ps1

      - name: Run isolated installer regression tests
        timeout-minutes: 5
        run: ./tests/installer-tests.ps1 -OutputDirectory test-results/ci

      # Users and the setup run install.ps1 in Windows PowerShell 5.1; the step above uses PowerShell 7.
      - name: Run the installer regression tests in Windows PowerShell 5.1
        timeout-minutes: 5
        shell: powershell
        run: ./tests/installer-tests.ps1 -OutputDirectory test-results/ci/powershell-5.1

      - name: Build the setup
        timeout-minutes: 5
        run: ./scripts/build-setup.ps1

      - name: Sign the setup
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: displayweave
          certificate-profile-name: displayweave-public
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe

      # Signing changed the setup, so its .sha256 is written again in build-setup.ps1's format.
      - name: Check the signatures
        if: env.SIGN == 'true'
        run: |
          $setup = Get-Item release/DisplayWeave-Setup-*.exe
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($setup.FullName + '.sha256', $hash + '  ' + $setup.Name + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          $scripts = @(Get-Item installer/install.ps1)
          $unsigned = @(@(Get-ChildItem dist -Recurse -Include *.exe, *.dll) + $scripts + $setup | Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' })
          if ($unsigned.Count -gt 0) { throw "Not signed: $($unsigned.FullName -join ', ')" }

      # Quiet-mode setup runs against a temporary install root; nothing is launched or registered.
      - name: Run the setup's end-to-end checks
        timeout-minutes: 5
        run: ./tests/setup-tests.ps1 -OutputDirectory test-results/ci

      # A second sign-in, so Key Vault gets a token even if the first one has expired during the build.
      - name: Sign in to Azure for the release key
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The release key in Azure Key Vault signs the tested checksums; the publish job releases them.
      - name: Sign the checksums with the release key
        if: env.SIGN == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/sign-release.ps1 -Version $env:VERSION -Directory release -KeyVault displayweave-release/release-signing

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DisplayWeave-test-results-${{ matrix.os }}-${{ github.sha }}
          path: |
            test-results/ci/*.txt
            test-results/ci/**/*.txt
          if-no-files-found: warn
          retention-days: 14

      # One package per commit: the release job publishes the windows-2022 build.
      - name: Upload the portable package
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DisplayWeave-Windows-${{ github.sha }}
          path: |
            release/DisplayWeave-*.zip
            release/DisplayWeave-*.zip.sha256
            release/DisplayWeave-Setup-*.exe
            release/DisplayWeave-Setup-*.exe.sha256
            release/DisplayWeave-*.sha256.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # A push to main whose version.txt has no release yet turns the files the build job just signed
  # and tested into a draft release with a build-provenance attestation. Installed copies never see
  # drafts; the publish job adds the release-key signatures and publishes it.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # Sigstore identity for the attestation
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find whether this version already has a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < src/DisplayWeave/version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The list includes drafts, so a draft waiting for its signature is not made twice.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "v$version"; then
            echo "v$version already has a release or draft; bump src/DisplayWeave/version.txt to make another."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tested package
        if: steps.version.outputs.exists != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DisplayWeave-Windows-${{ github.sha }}
          path: assets

      - name: Attest build provenance
        if: steps.version.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/DisplayWeave-*.zip
            assets/DisplayWeave-Setup-*.exe

      - name: Create the draft release for signing
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd assets
          gh release create "v$VERSION" "DisplayWeave-$VERSION.zip" "DisplayWeave-$VERSION.zip.sha256" \
            "DisplayWeave-Setup-$VERSION.exe" "DisplayWeave-Setup-$VERSION.exe.sha256" \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "DisplayWeave $VERSION" --target "$GITHUB_SHA" --generate-notes
          echo "Draft v$VERSION is ready. Sign and publish it with: .\scripts\sign-release.ps1 -Version $VERSION"

  # Publishes the draft with the signatures that the release key in Azure Key Vault made in the release
  # build. That build signed only after the maintainer approved the release environment, so that
  # approval ships the update; without it nothing is signed or published.
  publish:
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release-key signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DisplayWeave-Windows-${{ github.sha }}
          path: assets

      - name: Publish the signed release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release upload "v$VERSION" assets/*.sha256.sig --repo "$GITHUB_REPOSITORY"
          # A version without a suffix such as -preview is a full release and becomes the latest one.
          final=(--prerelease=false --latest)
          case "$VERSION" in *-*) final=() ;; esac
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false "${final[@]}"
          echo "Published v$VERSION."
