name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: a cancelled release job could leave a half-made draft behind.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the verified Zig toolchain
        run: ./scripts/fetch-tools.ps1

      - name: Build the Windows application
        run: ./scripts/build.ps1

      - name: Build x64 and x86 native components
        run: ./scripts/build-native.ps1 -Architecture all

      # These test modes do not open application windows, inject hooks, or change
      # the desktop. Monitor/window rendering tests require an interactive desktop.
      - name: Run managed and native policy tests
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE 'test-results\ci'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $problems = [System.Collections.Generic.List[string]]::new()

          $report = Join-Path $reportDirectory 'managed.txt'
          $application = Join-Path $env:GITHUB_WORKSPACE 'dist\DisplayWeave.exe'
          $testProcess = Start-Process -FilePath $application -ArgumentList @('--self-test', ('"{0}"' -f $report)) -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -Wait -PassThru
          if ($testProcess.ExitCode -ne 0) {
            $problems.Add("Managed tests exited with code $($testProcess.ExitCode).")
          }

          $passed = 0
          foreach ($file in @('managed.txt', 'managed.rules.txt', 'managed.automatic.txt', 'managed.lifecycle.txt')) {
            $reportPath = Join-Path $reportDirectory $file
            if (!(Test-Path -LiteralPath $reportPath -PathType Leaf)) {
              $problems.Add("Missing managed test report: $file")
              continue
            }
            $result = Get-Content -LiteralPath $reportPath -Raw
            Write-Output $result
            $summary = [regex]::Match($result, '(?m)^(\d+) passed; 0 failed\.\s*$')
            if ($summary.Success -and $result -notmatch '(?m)^FAIL ') {
              $passed += [int]$summary.Groups[1].Value
            } else {
              $problems.Add("Managed test report has failures or no passing summary: $file")
            }
          }
          if ($passed -lt 108) {
            $problems.Add("Expected at least 108 passing managed tests; found $passed.")
          }

          foreach ($architecture in @('x64', 'x86')) {
            $helper = Join-Path $env:GITHUB_WORKSPACE "dist\native-v2-$architecture\RegionHookHost.exe"
            $policyReport = Join-Path $reportDirectory "$architecture-policy.txt"
            & $helper --self-test-policy 2>&1 | Tee-Object -FilePath $policyReport
            if ($LASTEXITCODE -ne 0) {
              $problems.Add("$architecture shell policy tests exited with code $LASTEXITCODE.")
            }
            $policySummary = [regex]::Match((Get-Content -LiteralPath $policyReport -Raw), '^PASS shell and resident-hook policy: (\d+) deterministic cases;')
            if (!$policySummary.Success -or [int]$policySummary.Groups[1].Value -lt 223) {
              $problems.Add("$architecture shell policy tests did not report success.")
            }
            & $helper --self-test-ipc 2>&1 | Tee-Object -FilePath (Join-Path $reportDirectory "$architecture-ipc.txt")
            if ($LASTEXITCODE -ne 0) { $problems.Add("$architecture IPC security tests failed.") }
          }
          if ($problems.Count -gt 0) { throw ($problems -join [Environment]::NewLine) }

      - name: Package the portable application
        run: ./scripts/package.ps1

      - name: Run isolated installer regression tests
        timeout-minutes: 5
        run: ./tests/installer-tests.ps1 -OutputDirectory test-results/ci

      # Users and the setup run install.ps1 in Windows PowerShell 5.1; the step above uses PowerShell 7.
      - name: Run the installer regression tests in Windows PowerShell 5.1
        timeout-minutes: 5
        shell: powershell
        run: ./tests/installer-tests.ps1 -OutputDirectory test-results/ci/powershell-5.1

      # Quiet-mode setup runs against a temporary install root; nothing is launched or registered.
      - name: Build the setup and run its end-to-end checks
        timeout-minutes: 5
        run: |
          ./scripts/build-setup.ps1
          ./tests/setup-tests.ps1 -OutputDirectory test-results/ci

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DisplayWeave-test-results-${{ matrix.os }}-${{ github.sha }}
          path: |
            test-results/ci/*.txt
            test-results/ci/**/*.txt
          if-no-files-found: warn
          retention-days: 14

      # One package per commit: the release job publishes the windows-2022 build.
      - name: Upload the portable package
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DisplayWeave-Windows-${{ github.sha }}
          path: |
            release/DisplayWeave-*.zip
            release/DisplayWeave-*.zip.sha256
            release/DisplayWeave-Setup-*.exe
            release/DisplayWeave-Setup-*.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # A push to main whose version.txt has no release yet turns the files the build job just tested
  # into a draft release with a build-provenance attestation. Installed copies never see drafts:
  # the maintainer checks, signs and publishes it with scripts/sign-release.ps1, using a key that
  # is never on GitHub, so nothing here can ship an update by itself.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # Sigstore identity for the attestation
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find whether this version already has a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < src/DisplayWeave/version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The list includes drafts, so a draft waiting for its signature is not made twice.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "v$version"; then
            echo "v$version already has a release or draft; bump src/DisplayWeave/version.txt to make another."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tested package
        if: steps.version.outputs.exists != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DisplayWeave-Windows-${{ github.sha }}
          path: assets

      - name: Attest build provenance
        if: steps.version.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/DisplayWeave-*.zip
            assets/DisplayWeave-Setup-*.exe

      - name: Create the draft release for signing
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd assets
          gh release create "v$VERSION" "DisplayWeave-$VERSION.zip" "DisplayWeave-$VERSION.zip.sha256" \
            "DisplayWeave-Setup-$VERSION.exe" "DisplayWeave-Setup-$VERSION.exe.sha256" \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "DisplayWeave $VERSION" --target "$GITHUB_SHA" --generate-notes
          echo "Draft v$VERSION is ready. Sign and publish it with: .\scripts\sign-release.ps1 -Version $VERSION"
